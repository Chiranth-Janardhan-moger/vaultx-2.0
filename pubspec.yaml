name: vaultx
description: "A local-first, offline-capable password and card vault."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.3

  # Local Storage & Database
  path_provider: ^2.1.6
  path: ^1.9.0

  # Secret Storage
  flutter_secure_storage: ^11.2.0

  # Cryptography (Argon2id, AES-256-GCM, X25519 ECDH, HKDF)
  cryptography: ^2.7.2

  # Biometric Authentication
  local_auth: ^3.0.2

  # LAN Discovery & Network Transfer
  web_socket_channel: ^3.0.1

  # QR Code Generation & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # Media & Hardware
  google_mlkit_text_recognition: ^0.17.1
  camera: ^0.12.1
  permission_handler: ^13.0.2
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
