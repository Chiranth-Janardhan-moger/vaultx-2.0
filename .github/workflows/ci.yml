name: VaultX CI Matrix

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-security:
    name: Dependency Verification, Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Dependencies
        run: |
          flutter pub get
          flutter pub outdated

      - name: Run Secret Leak & Plaintext Logging Scan
        run: |
          chmod +x scripts/check_secrets_log.sh
          ./scripts/check_secrets_log.sh lib

      - name: Run Flutter Analyzer (Code Quality)
        run: flutter analyze

      - name: Run Flutter Unit, Security & Widget Tests
        run: flutter test --coverage

  build-android:
    name: Build Android APK
    needs: code-quality-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release Split APKs (v7 & v8 with R8)
        run: flutter build apk --target-platform android-arm,android-arm64 --split-per-abi

      - name: Build Android App Bundle AAB (release)
        run: flutter build appbundle --release

      - name: Upload Android Split APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultx-android-split-apks-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultx-android-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-windows:
    name: Build Windows Desktop
    needs: code-quality-and-security
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable (debug)
        run: flutter build windows --debug

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows Setup Installer (.exe)
        run: |
          New-Item -ItemType Directory -Force -Path build\windows\installer
          $isccPath = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $isccPath) {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $isccPath)) {
            $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          & $isccPath /DBuildMode=Debug /DMyAppVersion=2.0.0 windows/installer/vaultx_setup.iss

      - name: Upload Windows Setup Installer (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultx-windows-setup-${{ github.sha }}
          path: build/windows/installer/VaultX-2.0.0-Setup-x64.exe
          retention-days: 30

  build-apple:
    name: Build Apple Platforms (iOS & macOS)
    needs: code-quality-and-security
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ios, macos]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop Support
        if: matrix.target == 'macos'
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (No Codesign simulator build)
        if: matrix.target == 'ios'
        run: flutter build ios --no-codesign --debug

      - name: Build macOS Application (unsigned)
        if: matrix.target == 'macos'
        run: flutter build macos --debug

      - name: Package macOS Disk Image (.dmg)
        if: matrix.target == 'macos'
        run: |
          hdiutil create -volname "VaultX 2.0" -srcfolder build/macos/Build/Products/Debug/vaultx.app -ov -format UDZO build/macos/VaultX-2.0.0.dmg

      - name: Upload iOS Build Artifact (no-codesign simulator build)
        if: matrix.target == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: vaultx-ios-nocodesign-${{ github.sha }}
          path: build/ios/iphonesimulator/
          retention-days: 30

      - name: Upload macOS DMG Artifact
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: vaultx-macos-dmg-${{ github.sha }}
          path: build/macos/VaultX-2.0.0.dmg
          retention-days: 30

