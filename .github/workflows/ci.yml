name: VaultX CI Matrix

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-security:
    name: Dependency Verification, Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Dependencies
        run: |
          flutter pub get
          flutter pub outdated

      - name: Run Secret Leak & Plaintext Logging Scan
        run: |
          chmod +x scripts/check_secrets_log.sh
          ./scripts/check_secrets_log.sh lib

      - name: Run Flutter Analyzer (Code Quality)
        run: flutter analyze

      - name: Run Flutter Unit, Security & Widget Tests
        run: flutter test --coverage

  build-android:
    name: Build Android APK
    needs: code-quality-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release Split APKs (v7 & v8 with R8)
        run: flutter build apk --target-platform android-arm,android-arm64 --split-per-abi

      - name: Build Android App Bundle AAB (release)
        run: flutter build appbundle --release

      - name: Upload Android Split APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultx-android-split-apks-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultx-android-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-windows:
    name: Build Windows Desktop
    needs: code-quality-and-security
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable (debug)
        run: flutter build windows --debug

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultx-windows-${{ github.sha }}
          path: build/windows/x64/runner/Debug/
          retention-days: 30

  build-apple:
    name: Build Apple Platforms (iOS & macOS)
    needs: code-quality-and-security
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ios, macos]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop Support
        if: matrix.target == 'macos'
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (No Codesign simulator build)
        if: matrix.target == 'ios'
        run: flutter build ios --no-codesign --debug

      - name: Build macOS Application (unsigned)
        if: matrix.target == 'macos'
        run: flutter build macos --debug

      - name: Upload iOS Build Artifact (no-codesign simulator build)
        if: matrix.target == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: vaultx-ios-nocodesign-${{ github.sha }}
          path: build/ios/iphonesimulator/
          retention-days: 30

      - name: Upload macOS Build Artifact (unsigned app)
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: vaultx-macos-${{ github.sha }}
          path: build/macos/Build/Products/Debug/vaultx.app
          retention-days: 30

  build-linux:
    name: Build Linux Desktop
    needs: code-quality-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop Support
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Executable (debug)
        run: flutter build linux --debug

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultx-linux-${{ github.sha }}
          path: build/linux/x64/debug/bundle/
          retention-days: 30
